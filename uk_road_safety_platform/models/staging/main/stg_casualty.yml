version: 2
models:
  - name: stg_casualty
    description: Cleaned DfT casualty data
    config:
      persist_docs:
        relation: true
        columns: true
    constraints:
      - type: primary_key
        columns: [casualty_reference]
      - type: not_null
        columns: [casualty_reference]

    columns:
      - name: collision_index
        description: Collision index

      - name: collision_year
        description: Collision Year

      - name: collision_ref_no
        description: Collision Ref Number

      - name: vehicle_ref
        description: Vehicle Reference Number

      - name: casualty_ref
        description: Casualty Reference

      - name: casualty_class
        description: Casualty class 

      - name: gender
        description: Sex of casualty 

      - name: age
        description: Age of casualty 

      - name: age_band
        description: Age band of casualty 

      - name: casualty_severity
        description: Casualty severity 

      - name: enhanced_casualty_severity
        description: Enhanced casualty severity 

      - name: pedestrian_location
        description: Pedestrian location 

      - name: pedestrian_movement
        description: Pedestrian movement 

      - name: car_passenger
        description: Car passenger 

      - name: bus_coach_passenger
        description: Bus or coach passenger 

      - name: maintenance_worker
        description: Pedestrian road maintenance worker 

      - name: casualty_type
        description: Casualty type 

      - name: lsoa_of_casualty
        description: Casualty lsoa

      - name: casualty_imd_decile
        description: Casualty imd decile 

      - name: casualty_injury_based
        description: Casualty injury based 

      - name: casualty_adjusted_severity_serious
        description: Casualty Adjusted Severity Serious

      - name: casualty_adjusted_severity_slight
        description: Casualty Adjusted Severity Slight

      - name: casualty_distance_banding
        description: Casualty distance banding 

      - name: escooter_flag
        description: Escooter flag 


